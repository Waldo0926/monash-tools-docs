# nginx site for docs.secureview.tech. Files come from the gh-pages branch (see sync.sh).
# HTTPS is added by certbot: certbot --nginx -d docs.secureview.tech
server {
    listen 80;
    listen [::]:80;
    server_name docs.secureview.tech;

    root /opt/monash-tools-docs/site;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Install scripts and agent guides are read by curl and AI agents, so serve them as plain text.
    location ~ \.(sh|ps1|md|txt)$ {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /.git { deny all; }

    error_page 404 /404.html;
}
